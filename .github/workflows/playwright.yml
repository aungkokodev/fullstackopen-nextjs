name: End-to-End Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Set up environment file
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env.local
          echo "AUTH_SECRET=${{ secrets.AUTH_SECRET }}" >> .env.local
          echo "AUTH_URL=${{ secrets.AUTH_URL }}" >> .env.local
          echo "NODE_ENV=test" >> .env.local

      - name: Verify environment setup
        run: |
          echo "Checking .env.local file:"
          cat .env.local | sed 's/=.*/=***/' 
          echo ""
          echo "DATABASE_URL secret exists: ${{ secrets.DATABASE_URL != '' }}"
          echo "AUTH_SECRET secret exists: ${{ secrets.AUTH_SECRET != '' }}"
          echo "AUTH_URL secret exists: ${{ secrets.AUTH_URL != '' }}"
          echo ""
          echo "Checking if DATABASE_URL is loaded from file:"
          if grep -q "DATABASE_URL=" .env.local; then
            echo "✓ DATABASE_URL found in .env.local"
          else
            echo "✗ DATABASE_URL NOT found in .env.local"
          fi

      - name: Run database migrations
        run: npx drizzle-kit push

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_TRUST_HOST: 'true'

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
